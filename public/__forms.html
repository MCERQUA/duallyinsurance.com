<!--
  Static form definitions for Netlify form detection.
  Netlify scans this file at build time to register the "quote" and "contact"
  forms. The actual interactive forms live in /quote and /contact and post the
  same field names. This file is not linked from the UI.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input type="text" name="name" />
  <input type="text" name="businessName" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="state" />
  <input type="text" name="serviceType" />
  <input type="text" name="yearsInBusiness" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
  <input name="date_of_birth" />
  <input name="street_address" />
  <input name="city" />
  <input name="zip" />
  <input name="drivers_license_number" />
  <input name="drivers_license_issue_date" />
  <input name="drivers_license_expiration_date" />
  <textarea name="driver_names"></textarea>
  <input name="vehicle_year" />
  <input name="vehicle_make" />
  <input name="vehicle_model" />
  <textarea name="vehicle_vin"></textarea>
  <input name="vehicle_value" />
  <textarea name="accessories_description"></textarea>
  <input name="accessories_value" />
  <input name="current_policy_number" />
  <input name="current_policy_start_date" />
  <input name="current_policy_expiration_date" />
  <input name="current_coverage_limits" />
  <input name="prior_auto_insurance" />
</form>

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="subject" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
</form>
